name: Simulation
on:
  push:
    branches: ['**']
    paths: ['apps/simulation/**', '.github/workflows/simulation.yml']
    tags: ['simulation-v*']
  pull_request:
    paths: ['apps/simulation/**', '.github/workflows/simulation.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/simulation
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  biology:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r biology/requirements.lock
      - run: python -m unittest discover -s biology/tests -v
      - run: python biology/repressilator.py --output biology/output/ci.csv
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: DirectX 12 WARP smoke test
        shell: pwsh
        run: |
          $process = Start-Process build/Release/Evolve.exe -ArgumentList '--warp','--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Renderer smoke test exceeded 60 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            Get-Content smoke-test-error.log -ErrorAction SilentlyContinue
            throw "Renderer smoke test failed: $($process.ExitCode)"
          }
          Get-Content smoke-test.log
      - name: Assemble portable Windows package
        run: cmake --install build --config Release --prefix build/package
      - uses: actions/upload-artifact@v4
        with:
          name: Evolve-v0.1-Windows-x64
          path: apps/simulation/build/package/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Evolve-render-smoke-evidence
          path: |
            apps/simulation/evolve-v0.1-viewport.bmp
            apps/simulation/smoke-test*.log
            apps/simulation/smoke-test.evolve
  release:
    if: startsWith(github.ref, 'refs/tags/simulation-v')
    needs: [core, biology, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Evolve-v0.1-Windows-x64
          path: package
      - run: cd package && zip -r ../Evolve-Windows-x64.zip .
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" Evolve-Windows-x64.zip --verify-tag --title "Evolve desktop $RELEASE_TAG" --generate-notes
